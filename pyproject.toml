[tool.pytest.ini_options]
# archive/ holds retired code and its tests: kept for reference, neither run nor linted.
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
indent-width = 4
extend-exclude = ["archive"]

[tool.ruff.lint]
select = [
	"E",
	"F",
	"W",
]

ignore = [
	"W191",
]

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"
line-ending = "auto"