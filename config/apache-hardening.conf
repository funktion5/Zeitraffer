# Installed by install.sh (step web_hardening) as /etc/apache2/conf-available/zeitraffer-hardening.conf.
# Server-wide on purpose: this host serves only the Zeitraffer site, and ServerTokens only works
# server-wide. The name sorts after Debian's security.conf, so these values replace its own.

ServerTokens Prod
ServerSignature Off

# No other site may show these pages in a frame. No script-src yet: camera.php, highlights.php and
# the job watcher still have inline scripts, which such a rule would block.
Header always set X-Frame-Options "DENY"
Header always set Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "same-origin"

# Debian serves its icons to anyone, without the login; no page uses them.
<Directory /usr/share/apache2/icons>
    Require all denied
</Directory>
