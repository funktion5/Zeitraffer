name: Tests
run-name: Tests for ${{ github.ref_name }} by ${{ github.actor }}
on: [push, pull_request]

# The jobs only read the repository.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Dependencies and lint run side by side; tests wait for both, but run even if one of them failed.
jobs:
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      # The pins install, but pip only warns about packages whose requirements clash; this fails on it.
      - run: python -m pip check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # No pip cache here: lint finishes first and would save a cache holding only ruff under the key
      # the other jobs use, so they would download everything again on every run.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Only ruff, at the version requirements.txt pins, so lint does not wait for onnxruntime and OpenCV.
      - run: python -m pip install "$(grep '^ruff==' requirements.txt)"
      - run: ruff check .
      - run: ruff format --check .

  tests:
    name: Tests
    needs: [dependencies, lint]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
