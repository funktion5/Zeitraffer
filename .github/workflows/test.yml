name: Tests
run-name: Tests for ${{ github.ref_name }} by ${{ github.actor }}
on: [push, pull_request]

# The jobs only read the repository.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless. Not on main: there the run may be
# deploying, and a deploy must never stop halfway, so a newer run waits for it instead.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Dependencies and lint run side by side; tests wait for both, but run even if one of them failed.
jobs:
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      # The pins install, but pip only warns about packages whose requirements clash; this fails on it.
      - run: python -m pip check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # No pip cache here: lint finishes first and would save a cache holding only ruff under the key
      # the other jobs use, so they would download everything again on every run.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Only ruff, at the version requirements.txt pins, so lint does not wait for onnxruntime and OpenCV.
      - run: python -m pip install "$(grep '^ruff==' requirements.txt)"
      - run: ruff check .
      - run: ruff format --check .

  tests:
    name: Tests
    needs: [dependencies, lint]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest

  deploy:
    name: Deploy
    needs: [dependencies, lint, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Pull main and install the requirements on the VPS
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${VPS_HOST#*@}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$VPS_HOST" bash -s <<'EOF'
          set -e
          cd ~/timelapse
          # Wait until no video job (night run, web UI runs) and no blur round is running, and keep
          # both locks until the end so none starts while the code is being swapped.
          exec 8>>state/zeitraffer-run.lock 9>>state/privacy-blur.lock
          flock 8
          flock 9
          old=$(git rev-parse HEAD)
          git pull --ff-only
          .venv/bin/pip install -r requirements.txt
          # The root-owned copies of the web wrappers need sudo, which a deploy does not have.
          git diff --quiet "$old" HEAD -- scripts/web \
            || echo "::warning::scripts/web changed: run ./install.sh web_bridge on the VPS"
          EOF
